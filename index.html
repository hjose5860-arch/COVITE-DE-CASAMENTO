<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Convite Andressa &amp; Henrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@400;500&display=swap">
<style id="css">  :root{
    color-scheme: light;
    --paper:#EEE5D7;
    --paper-2:#E9DFD0;
    --paper-3:#E3D8C7;
    --ink:#4E4032;
    --ink-soft:#8A7A66;
    --wine:#9C7838;
    --wine-deep:#6E5220;
    --gold:#C4A067;
    --gold-hot:#FFD897;
    --sage:#7C8866;
    --script:"Pinyon Script","Snell Roundhand","Brush Script MT",cursive;
    --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
    --sans:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  }
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);overflow:hidden}
  body.aberto{overflow:auto}

  /* ---------- ENVELOPE ---------- */
  #envelope{position:fixed;inset:0;z-index:10;overflow:hidden;background:#2a1a10}
  #luz{position:absolute;inset:0;opacity:0;
    background:radial-gradient(60% 45% at 50% 52%,#fff4dc 0%,var(--gold-hot) 30%,#d89b4a 60%,#6b3b17 100%);
    transition:opacity .9s ease}
  .aba-wrap{position:absolute;inset:0;transition:transform 1.5s cubic-bezier(.7,0,.2,1);will-change:transform}
  .aba{position:absolute;inset:0;background-color:var(--paper);background-size:100% 100%;background-repeat:no-repeat}
  .aba.topo{clip-path:polygon(-1% -1%,101% -1%,50% 52.4%)}
  .aba.base{clip-path:polygon(-1% 101%,101% 101%,50% 51.6%)}
  .aba .tom{position:absolute;inset:0;pointer-events:none}
  .aba.base .tom{background:linear-gradient(to top,rgba(0,0,0,0) 40%,rgba(90,70,45,.07))}
  .aba.esq .tom{background:linear-gradient(to right,rgba(90,70,45,.02),rgba(90,70,45,.10))}
  .aba.dir .tom{background:linear-gradient(to left,rgba(90,70,45,.02),rgba(90,70,45,.10))}
  .aba.topo .tom{background:linear-gradient(to bottom,rgba(255,255,255,.06),rgba(255,255,255,0))}
  .aba.esq{clip-path:polygon(-1% -1%,50.4% 52%,-1% 101%)}
  .aba.dir{clip-path:polygon(101% -1%,49.6% 52%,101% 101%)}
  .w-topo{z-index:4;filter:drop-shadow(0 5px 7px rgba(90,70,45,.22))}
  .w-base{z-index:3;filter:drop-shadow(0 -2px 4px rgba(90,70,45,.14))}
  .w-esq,.w-dir{z-index:2}

  #costuras{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;opacity:0;transition:opacity 1s ease}
  [hidden]{display:none!important}
  .aba-wrap{transition:transform 1.5s cubic-bezier(.7,0,.2,1),filter 1s ease}
  #envelope{transition:background-color .8s ease}
  #costuras line{stroke:#FFC878;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round}

  #selo{position:absolute;left:50%;top:52%;z-index:8;width:min(42vw,180px);aspect-ratio:1;
    transform:translate(-50%,-50%);border:0;padding:0;background:none;cursor:pointer;
    transition:transform 1.4s cubic-bezier(.6,-.2,.3,1),opacity 1s ease;-webkit-tap-highlight-color:transparent}
  #selo img{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 7px 9px rgba(70,40,20,.4)) drop-shadow(0 1px 1px rgba(70,40,20,.35));transition:filter .8s ease}
  #selo .luzes{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;mix-blend-mode:screen}
  body.e1 #selo img{filter:drop-shadow(0 7px 9px rgba(70,40,20,.4)) brightness(1.05) saturate(1.08)}
  #selo:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:50%}
  #selo .anel{opacity:0;transition:opacity .8s ease}
  #selo .halo{opacity:0;transition:opacity .8s ease}
  body:not(.tocado) #selo{animation:respira 2.6s ease-in-out infinite}
  @keyframes respira{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.035)}}

  #dica{position:absolute;left:0;right:0;top:calc(52% + min(23vw,100px));z-index:6;text-align:center;
    font:500 11px/1.4 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--ink-soft);
    transition:opacity .5s ease;pointer-events:none}
  #dica span{display:block;font-size:14px;letter-spacing:0;margin-bottom:6px;animation:sobe 1.8s ease-in-out infinite}
  @keyframes sobe{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}

  /* etapas */
  body.e1 #dica{opacity:0}
  body.e1 #selo .anel,body.e1 #selo .halo{opacity:1}
  body.e1 #selo .anel{animation:pulsa 1s ease-in-out infinite}
  @keyframes pulsa{0%,100%{stroke-width:2.2}50%{stroke-width:3.4}}
  body.e2 #costuras{opacity:1}
  body.e2 #luz{opacity:1}
  body.e2 .w-topo{transform:translateY(-1.8%);filter:drop-shadow(0 4px 14px rgba(255,196,110,.95)) drop-shadow(0 0 4px rgba(255,230,170,.9))}
  body.e2 .w-base{transform:translateY(1.8%);filter:drop-shadow(0 -4px 14px rgba(255,196,110,.95)) drop-shadow(0 0 4px rgba(255,230,170,.9))}
  body.e2 .w-esq{transform:translateX(-1.8%);filter:drop-shadow(4px 0 12px rgba(255,196,110,.8))}
  body.e2 .w-dir{transform:translateX(1.8%);filter:drop-shadow(-4px 0 12px rgba(255,196,110,.8))}
  body.e3 .w-topo{transform:translateY(-62%)}
  body.e3 .w-base{transform:translateY(62%)}
  body.e3 .w-esq{transform:translateX(-62%)}
  body.e3 .w-dir{transform:translateX(62%)}
  body.e3 #costuras{opacity:0}
  body.e3 #envelope{background-color:transparent}
  body.e3 #luz{opacity:0;transition:opacity 1.3s ease .35s}
  body.e3 #selo{transform:translate(-50%,-150%) scale(1.25);opacity:0}
  body.e4 #envelope{opacity:0;transition:opacity 1s ease}
  body.fim #envelope{display:none}

  /* ---------- CONVITE ---------- */
  #convite{min-height:100%;opacity:0;transform:scale(1.06);filter:blur(8px);
    transition:opacity 1.4s ease,transform 1.8s cubic-bezier(.2,.7,.2,1),filter 1.4s ease;
    background:var(--paper);background-size:360px 360px}
  body.e3 #convite{opacity:1;transform:none;filter:none}
  .folha{max-width:480px;margin-inline:auto;padding-inline:28px;padding-block:56px 64px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:28px}
  .ramo{width:min(260px,70vw);height:auto;display:block}
  .ramo.baixo{transform:scaleY(-1)}
  .sobre{font:500 11px/1.5 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin:0}
  .nomes{font-family:var(--script);font-weight:400;color:var(--wine);margin:0;line-height:.9;font-size:clamp(64px,19vw,96px)}
  .nomes small{display:block;font-family:var(--serif);font-style:italic;font-size:.3em;color:var(--gold);margin-block:.1em .15em;line-height:1}
  .data{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:100%;max-width:320px;font-variant-numeric:lining-nums}
  .data .lado{font:500 11px/1.3 var(--sans);letter-spacing:.3em;text-transform:uppercase;border-block:1px solid var(--gold);padding-block:8px}
  .data .dia{font-size:54px;line-height:1;font-weight:400}
  .data .dia small{display:block;font:500 10px/1 var(--sans);letter-spacing:.3em;margin-top:6px}
  .texto{font-size:17px;line-height:1.65;max-width:34ch;margin:0;color:var(--ink)}
  .texto em{color:var(--wine)}
  .contagem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px}
  .contagem div{display:flex;flex-direction:column;gap:4px;padding-block:12px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent)}
  .contagem b{font-weight:400;font-size:28px;font-variant-numeric:tabular-nums lining-nums}
  .contagem span{font:500 9px/1 var(--sans);letter-spacing:.25em;text-transform:uppercase;color:var(--ink-soft)}
  .local h2{font-family:var(--script);font-weight:400;font-size:40px;color:var(--wine);margin:0 0 6px}
  .local p{margin:0;font-size:16px;line-height:1.55}
  .botoes{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
  .btn{display:block;padding:15px 20px;font:500 12px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1px solid var(--wine);background:transparent;color:var(--wine)}
  .btn.cheio{background:var(--wine);color:var(--paper)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .assina{font:400 11px/1.5 var(--sans);letter-spacing:.12em;color:var(--ink-soft);margin:0}
  .assina b{font-weight:500}
  #som{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:44px;height:44px;border-radius:50%;
    border:0;background:linear-gradient(145deg,#D6B57A,#B08A4A);color:#fff;box-shadow:0 4px 12px rgba(90,70,45,.3);font:500 16px/1 var(--sans);cursor:pointer;display:grid;place-items:center}
  #som:focus-visible{outline:2px solid var(--wine);outline-offset:3px}


  /* ---------- SEÇÕES ---------- */
  #convite{display:flex;flex-direction:column}
  .sec{position:relative;padding-inline:24px;padding-block:72px;text-align:center;background-color:var(--paper);background-size:240px 240px}
  .sec>.in{max-width:460px;margin-inline:auto;display:flex;flex-direction:column;align-items:center;gap:22px}
  .sec.tom2{background-color:var(--paper-2)}
  .sec.tom3{background-color:#E6DCCC}
  .rasgo{position:absolute;left:0;right:0;top:-15px;height:16px;pointer-events:none;filter:drop-shadow(0 -2px 2px rgba(90,70,45,.10))}
  .rasgo i{position:absolute;inset:0;background:inherit}
  .titulo{font-family:var(--script);font-weight:400;color:var(--wine);font-size:clamp(40px,11vw,52px);line-height:1.05;margin:0;text-wrap:balance}
  .fio{display:flex;align-items:center;gap:12px;color:var(--gold);width:min(220px,60vw)}
  .fio::before,.fio::after{content:"";flex:1;height:1px;background:currentColor;opacity:.7}
  .fio b{width:6px;height:6px;transform:rotate(45deg);border:1px solid currentColor}

  .hero{padding-block:64px 56px}
  .hero .selinho{width:92px;height:92px;filter:drop-shadow(0 5px 7px rgba(70,40,20,.35))}
  .hero .dataHero{font:500 12px/1 var(--sans);letter-spacing:.42em;color:var(--ink-soft);margin:0;font-variant-numeric:lining-nums}
  .role{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-soft);text-decoration:none;margin-top:8px}
  .role svg{animation:desce 1.8s ease-in-out infinite}
  @keyframes desce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(5px);opacity:1}}

  .frase{font-family:var(--script);font-size:clamp(30px,8.5vw,40px);line-height:1.15;color:var(--wine);margin:0}
  .frase span{display:block}

  .cronograma{list-style:none;margin:0;padding:0;position:relative;width:100%;max-width:320px;display:flex;flex-direction:column;gap:30px}
  .cronograma::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:linear-gradient(var(--gold),var(--gold)) center/1px 100% no-repeat;opacity:.6}
  .cronograma li{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center}
  .cronograma .h{text-align:right;font-size:26px;font-variant-numeric:lining-nums tabular-nums;padding-right:14px}
  .cronograma .ev{text-align:left;padding-left:14px;font:500 11px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
  .cronograma .ponto{justify-self:center;width:7px;height:7px;transform:rotate(45deg);background:var(--paper);border:1px solid var(--gold);position:relative;z-index:1;transition:background .4s ease,box-shadow .4s ease}
  .cronograma li.ativo .ponto{background:var(--gold);box-shadow:0 0 0 4px rgba(196,160,103,.18)}
  #viajante{position:absolute;left:50%;top:0;width:30px;height:30px;margin-left:-15px;margin-top:-15px;z-index:2;pointer-events:none;transition:top .25s linear;filter:drop-shadow(0 3px 4px rgba(70,40,20,.35))}

  .mapa{position:relative;width:100%;max-width:340px;aspect-ratio:4/3;border:1px solid var(--gold);padding:6px;background:var(--paper)}
  .mapa svg{display:block;width:100%;height:100%}
  .mapa a{position:absolute;left:14px;top:14px;font:500 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;background:var(--paper);color:var(--wine);border:1px solid var(--gold);padding:8px 10px;text-decoration:none}
  .endereco{font-size:16px;line-height:1.55;margin:0}
  .endereco strong{display:block;font-weight:500;font-size:19px;margin-bottom:2px}
  .linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
  .mini{font:500 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;background:none;border:1px solid var(--gold);color:var(--wine);padding:8px 12px;cursor:pointer}
  .mini:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .paleta{display:flex;gap:10px;justify-content:center}
  .paleta i{width:26px;height:26px;border-radius:50%;border:1px solid rgba(90,70,45,.25);display:block}
  .aviso{font:400 13px/1.5 var(--sans);color:var(--ink-soft);margin:0;max-width:34ch}
  .pix{display:flex;flex-direction:column;gap:6px;align-items:center;padding:16px 20px;border:1px dashed var(--gold);width:100%;max-width:320px}
  .pix code{font:500 15px/1.3 var(--sans);letter-spacing:.02em;color:var(--ink);user-select:all;word-break:break-all}
  .pix small{font:500 10px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}

  .rsvpSelo{border:0;background:none;padding:0;cursor:pointer;width:118px;height:118px;display:block;animation:respira2 2.6s ease-in-out infinite}
  .rsvpSelo img{width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(70,40,20,.38))}
  .rsvpSelo:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:50%}
  @keyframes respira2{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .cliqueAbrir{font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:15px;margin:-10px 0 0}
  #formRsvp{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:left;animation:abre .6s ease}
  @keyframes abre{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  #formRsvp label{font:500 10px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);display:flex;flex-direction:column;gap:8px}
  #formRsvp input,#formRsvp textarea,#formRsvp select{font:400 16px/1.4 var(--serif);color:var(--ink);background:rgba(255,255,255,.45);border:0;border-bottom:1px solid var(--gold);padding:10px 4px;border-radius:0}
  #formRsvp textarea{resize:vertical;min-height:70px}
  #formRsvp input:focus,#formRsvp textarea:focus,#formRsvp select:focus{outline:none;border-bottom-color:var(--wine);background:rgba(255,255,255,.7)}
  .escolha{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .escolha input{position:absolute;opacity:0}
  .escolha label{border:1px solid var(--gold);padding:13px 8px!important;text-align:center;cursor:pointer;flex-direction:row!important;justify-content:center;letter-spacing:.14em!important}
  .escolha input:checked+label{background:var(--wine);color:var(--paper)!important;border-color:var(--wine)}
  .escolha input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
  .aviso.individual{max-width:none;text-align:center;padding:14px 16px;border-block:1px solid color-mix(in srgb,var(--gold) 55%,transparent);font-size:13.5px;line-height:1.6}
  #rsvpErro{font:400 13px/1.4 var(--sans);color:#8a2a1a;margin:0;min-height:1em}
  #rsvpOk{display:flex;flex-direction:column;gap:12px;align-items:center}
  #rsvpOk p{margin:0;font-size:16px;line-height:1.5;max-width:30ch}

  .final{padding-bottom:0}
  .final .in{gap:10px}
  .final .nomesPe{font:400 20px/1.3 var(--serif);letter-spacing:.06em;margin:0 0 28px}
  .foto{width:calc(100% + 48px);margin-inline:-24px;aspect-ratio:3/4;max-width:none;position:relative;overflow:hidden;
    background:linear-gradient(180deg,var(--paper-2) 0%,#d9c9ae 55%,#c9b28e 100%)}
  .foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
  .foto::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(var(--paper) 0%,rgba(238,229,215,0) 20%)}
  .foto .vazia{position:absolute;inset:auto 0 42%;display:flex;flex-direction:column;align-items:center;gap:10px;font:500 11px/1.4 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:rgba(78,64,50,.55)}
  .rodape{display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 24px calc(28px + env(safe-area-inset-bottom,0px));background:#E6DCCC}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    #viajante{transition:none}
    .aba-wrap,#selo,#convite,#luz,#costuras{transition-duration:.3s!important}
  }

  /* ---------- ADMIN (só aparece para quem pode editar) ---------- */
  #btnAdmin{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--gold);background:rgba(238,229,215,.94);color:var(--wine);font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 2px 8px rgba(90,70,45,.18)}
  #btnAdmin:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
  #painel{position:fixed;inset:0;z-index:60;background:#F4EEE4;overflow-y:auto;-webkit-overflow-scrolling:touch;font-family:var(--sans);color:var(--ink)}
  #painel .ptopo{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:#F4EEE4;border-bottom:1px solid rgba(196,160,103,.45)}
  #painel h2{font:500 15px/1.2 var(--sans);letter-spacing:.04em;margin:0}
  .pcorpo{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:16px 150px;display:flex;flex-direction:column;gap:18px}
  .grupo{border:1px solid rgba(196,160,103,.45);background:#FBF8F3;padding:16px;display:flex;flex-direction:column;gap:14px;margin:0;min-width:0}
  .grupo legend{font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--wine);padding:0 6px}
  .campo{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--ink-soft);min-width:0}
  .campo input,.campo textarea{font:400 16px/1.4 var(--sans);color:var(--ink);background:#fff;border:1px solid #D9CCB8;border-radius:6px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
  .campo textarea{min-height:84px;resize:vertical}
  .campo input:focus,.campo textarea:focus,.linhaProg input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pdica{font-size:12px;color:var(--ink-soft);margin:0;font-weight:400;line-height:1.45}
  .imgcampo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .imgcampo img{width:72px;height:72px;object-fit:contain;background:#EEE5D7;border-radius:6px}
  .imgcampo.retrato img{object-fit:cover;width:72px;height:96px}
  .imgcampo input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
  .pbtn{font:500 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:12px 14px;border-radius:6px;border:1px solid var(--wine);background:#fff;color:var(--wine);cursor:pointer;text-align:center}
  .pbtn.cheio{background:var(--wine);color:#fff}
  .pbtn:disabled{opacity:.5;cursor:default}
  .pbtn:focus-visible,.xbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .imgcampo label.pbtn:focus-within{outline:2px solid var(--gold);outline-offset:2px}
  .linhaProg{display:grid;grid-template-columns:100px 1fr 40px;gap:8px;align-items:center}

  // ---------- texturas ----------
  const cacheRuido={};
  function ruido(base){

  // ---------- envelope em relevo seco ----------
  let semente=3; const rnd=()=>((semente=(semente*9301+49297)%233280)/233280);

  function guirlanda(x,p0,p1,interior,U){

  }

  function tingir(src,cor){ const c=document.createElement('canvas'); c.width=src.width; c.height=src.height; const x=c.getContext('2d'); x.drawImage(src,0,0); x.globalCompositeOperation='source-in'; x.fillStyle=cor; x.fillRect(0,0,c.width,c.height); return c; }
  let urlAtual=null;
  function pintaEnvelope(){
    const dpr=Math.min(2,window.devicePixelRatio||1), W=Math.round(innerWidth*dpr), H=Math.round(innerHeight*dpr), U=Math.min(W,H*.62), C=[W/2,H*.52];

    x.lineWidth=Math.max(1,dpr); const i1=U*.035,i2=U*.05; x.strokeRect(i1,i1,W-2*i1,H-2*i1); x.lineWidth=Math.max(.8,dpr*.7); x.strokeRect(i2,i2,W-2*i2,H-2*i2);

    const vg=g.createRadialGradient(W/2,H/2,U*.2,W/2,H/2,Math.max(W,H)*.75); vg.addColorStop(0,'rgba(255,255,255,.05)'); vg.addColorStop(1,'rgba(120,95,65,.08)'); g.fillStyle=vg; g.fillRect(0,0,W,H);

  function desenhaRamo(svg){

    for(let i=1;i<14;i++){ const t=i/14, x=20+220*t, yy=(1-t)*(1-t)*44+2*(1-t)*t*8+t*t*44, dy=2*(1-t)*(8-44)+2*t*(44-8), ang=Math.atan2(dy,220)*180/Math.PI;

  function preparaImagem(arquivo,max,transparente){
    return new Promise((ok,falha)=>{
      const url=URL.createObjectURL(arquivo), im=new Image();
      im.onload=()=>{ let w=im.naturalWidth,h=im.naturalHeight; const esc2=Math.min(1,max/Math.max(w,h)); w=Math.round(w*esc2); h=Math.round(h*esc2);
        const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
        let out=c.toDataURL('image/webp',transparente?.9:.82);
        if(!out.startsWith('data:image/webp')) out=transparente?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85);
        ok(out); };
      im.onerror=()=>{ URL.revokeObjectURL(url); falha(new Error('imagem')); };
      im.src=url;
    });

    if(!/^\d{1,2}:\d{2}$/.test(r.hora)) return 'Escolha o horário.';
    if(!r.local.nome&&!r.local.endereco) return 'Preencha o local.';
    const z=zap(r.rsvp.whatsapp); if(z.length<12||z.length>13) return 'Confira o WhatsApp: use DDD + número, ex.: 11 91234-5678.';
    if(r.presentes.link&&!/^https?:\/\//i.test(r.presentes.link)) return 'O link da lista precisa começar com https://';
    return '';
  }
  function status(t,erro){ const s=document.getElementById('statusPainel'); if(!s) return; s.textContent=t; s.classList.toggle('erro',!!erro); }

  function abrirPainel(){
    if(!rascunho) rascunho=clone(D);
    let p=document.getElementById('painel'); if(!p){ p=document.createElement('div'); p.id='painel'; p.setAttribute('role','dialog'); p.setAttribute('aria-label','Editar convite'); document.body.appendChild(p); }
    p.innerHTML=htmlPainel(rascunho); p.hidden=false; b.style.overflow='hidden';
    ligarPainel(p); document.getElementById('pNome1').focus({preventScroll:true});
  }
  function fecharPainel(){ const p=document.getElementById('painel'); if(p) p.hidden=true; b.style.overflow=''; }

  function ligarPainel(p){
    p.querySelector('#pFechar').onclick=()=>{ lerPainel(); fecharPainel(); };
    p.querySelector('#pProgAdd').onclick=()=>{ const box=p.querySelector('#pProg'); box.insertAdjacentHTML('beforeend',linhaProg({hora:'',evento:''},box.children.length)); box.lastElementChild.querySelector('input').focus(); };
    p.querySelector('#pProg').onclick=e=>{ const x=e.target.closest('[data-tirar]'); if(x) x.parentElement.remove(); };
    p.querySelector('#pSelo').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; status('Preparando o selo…');
      try{ rascunho.selo=await preparaImagem(f,640,true); p.querySelector('#pSeloPrev').src=rascunho.selo; status('Selo trocado. Toque em "Ver prévia" ou "Salvar e publicar".'); }catch(_){ status('Não consegui abrir essa imagem. Tente outro arquivo PNG.',true); } };
    p.querySelector('#pFoto').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; status('Preparando a foto…');
      try{ lerPainel(); rascunho.foto=await preparaImagem(f,1200,false); p.innerHTML=htmlPainel(rascunho); ligarPainel(p); status('Foto trocada.'); }catch(_){ status('Não consegui abrir essa foto. Tente outro arquivo.',true); } };
    const tirar=p.querySelector('#pFotoTirar'); if(tirar) tirar.onclick=()=>{ lerPainel(); rascunho.foto=''; p.innerHTML=htmlPainel(rascunho); ligarPainel(p); status('Foto removida.'); };
    p.querySelector('#pPrevia').onclick=()=>{ const r=lerPainel(), er=validar(r); if(er){ status(er,true); return; } mostrarPrevia(); };
    p.querySelector('#pPublicar').onclick=()=>{ const r=lerPainel(), er=validar(r); if(er){ status(er,true); return; } publicar(); };
  }

  let dadosPublicados=D;
  function mostrarPrevia(){
    D=clone(rascunho); montar(); fecharPainel(); abrirDireto(); window.scrollTo(0,0);
    let bar=document.getElementById('barraPrevia');
    if(!bar){ bar=document.createElement('div'); bar.id='barraPrevia'; bar.setAttribute('role','region'); bar.setAttribute('aria-label','Prévia não publicada'); document.body.appendChild(bar); }
    bar.innerHTML='<span>Prévia: ainda não publicada</span><button type="button" id="bEditar">Editar</button><button type="button" id="bDescartar">Descartar</button><button type="button" class="cheio" id="bPublicar">Publicar</button>';
    bar.hidden=false; const ba=document.getElementById('btnAdmin'); if(ba) ba.hidden=true;
    bar.querySelector('#bEditar').onclick=()=>abrirPainel();
    bar.querySelector('#bDescartar').onclick=()=>{ rascunho=null; D=dadosPublicados; montar(); bar.hidden=true; if(ba) ba.hidden=false; };
    bar.querySelector('#bPublicar').onclick=()=>publicar();
  }

  async function publicar(){
    if(publicando) return; publicando=true;
    const botoes=[...document.querySelectorAll('#pPublicar,#bPublicar')]; botoes.forEach(x=>{ x.disabled=true; x.textContent='Publicando…'; });
    const aviso=(t,erro)=>{ status(t,erro); const bar=document.getElementById('barraPrevia'); if(bar&&!bar.hidden) bar.querySelector('span').textContent=t; };
    aviso('Publicando…');
    try{
      const art=await window.claude?.use?.('artifact');
      if(!art){ throw {code:'not_granted'}; }
      try{ sessionStorage.setItem('rascunhoConvite',JSON.stringify(rascunho)); }catch(_){}
      await art.publish(documentoCompleto(rascunho));
      try{ sessionStorage.removeItem('rascunhoConvite'); }catch(_){}
      aviso('Publicado! Atualizando…');
    }catch(e){
      const c=e&&e.code;
      const msg={conflict:'O convite foi alterado em outro lugar. Ele vai recarregar com a versão mais nova.',
        not_writer:'Esta conta pode ver o convite, mas não pode editar.',not_granted:'A edição não está disponível nesta visualização. Abra o convite pelo claude.ai com a sua conta.',
        consent_required:'A edição não está disponível nesta visualização.',capability_disabled:'A edição não está disponível nesta visualização.',
        too_large:'O convite ficou pesado demais. Use uma foto menor e tente de novo.',rate_limited:'Muitas publicações seguidas. Espere um minuto e tente de novo.',
        invalid_content:'Não foi possível montar o convite. Recarregue a página e tente de novo.'}[c]||'Não consegui publicar agora. Tente de novo em instantes.';
      aviso(msg,true);
      botoes.forEach(x=>{ x.disabled=false; x.textContent=x.id==='bPublicar'?'Publicar':'Salvar e publicar'; });
      publicando=false;
    }
  }

  // recupera um rascunho que não chegou a ser publicado (ex.: conflito)
  try{ const r=sessionStorage.getItem('rascunhoConvite'); if(r){ rascunho=JSON.parse(r); sessionStorage.removeItem('rascunhoConvite'); } }catch(_){}

  (async()=>{
    let pode=false;
    try{ const u=await window.claude?.use?.('user'); pode=!!(u&&await u.canEdit()); }catch(_){}
    if(!pode) return;
    const ba=document.createElement('button'); ba.id='btnAdmin'; ba.type='button';
    ba.innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9.5 1.5l3 3-8 8H1.5v-3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Editar';
    ba.onclick=abrirPainel; document.body.appendChild(ba);
    if(rascunho){ ba.hidden=true; mostrarPrevia(); }
  })();
})();
</script></body></html>
